<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000000'/%3E%3Crect x='1' y='1' width='14' height='14' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3Crect x='6' y='3' width='4' height='10' fill='%23ff0000'/%3E%3Crect x='4' y='5' width='8' height='6' fill='%23ff0000'/%3E%3Crect x='5' y='5' width='2' height='2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>Krunked Well</title>
    <style>
      :root {
        --kw-font-pixel: 'Cascadia Mono', 'Consolas', 'Lucida Console', 'Courier New', monospace;
        --kw-light: #ffffff;
        --kw-mid: #ff0000;
        --kw-dark: #000000;
        --kw-special: #007eff;
      }
      *, *::before, *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #app {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #ffffff;
        font-family: var(--kw-font-pixel);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
      .kw-px-cell {
        border: 2px solid currentColor;
        padding: 7px 9px;
      }
      .kw-px-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        opacity: 0.72;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--kw-dark);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--kw-light);
      }
      .kw-px-btn:not(:disabled):active,
      .kw-px-card:active {
        transform: translate(1px, 1px);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
